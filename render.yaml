# Render Blueprint: the managed alternative to deploy/ (see deploy/README.md).
# Render dashboard -> New -> Blueprint -> pick this repo.
#
# Plan: the free plan's 512 MB cannot hold the geospatial stack plus a day's
# tracks; "standard" (2 GB) is the smallest that runs the pipeline reliably.
# Render has no built-in password gate: anyone with the URL can open the app.
services:
  - type: web
    name: gts-pipeline
    runtime: docker
    plan: standard
    region: frankfurt
    branch: deploy/docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: GTS_HOSTED
        value: "1"
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "400"
      - key: STREAMLIT_SERVER_MAX_MESSAGE_SIZE
        value: "400"
